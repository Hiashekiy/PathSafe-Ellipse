# ---------------------------------------------------------------------------
# PathSafe-EllipseNet training config (implementation plan V1.0, section 9).
#
# Weights are an experiment starting point, not validated optima.
# ---------------------------------------------------------------------------
data:
  trajectory_dir: ./data/processed_v3/trajectories/train_v3
  split_frac: [0.8, 0.1, 0.1]      # by map_group, never by point
  split_seed: 0
  max_trajectories: null           # null = use everything on disk
  num_workers: 0                   # 0 = no worker processes (avoids the shared-memory
                                   # pressure that killed the first run); SDF is cheap
  cache_meta: true

label:
  lidar_rays: 16
  lidar_max_range_m: 9.0
  r_max_m: 3.0                     # max centre offset (centre decoder range clamp)
  eps_r_m: 0.05                    # ray margin before the offset ratio is applied
  min_eig_m2: 1.0e-6               # read from the label generator config
  r_axis_max_m: 6.0
  rho_max: 0.85                    # continuity threshold from the generator
  epsilon_m: 0.01                  # border margin (generator epsilon_m)
  angle_aspect_min: 1.05           # angle loss mask: only anisotropic GT

model:
  map_width: 32
  map_out_ch: 64
  map_strides: [4, 8, 16]
  lidar_ch: 64
  geom_ch: 32
  fusion_ch: 128
  backbone_blocks: 4
  backbone_dilations: [1, 2, 4, 8]
  dropout: 0.1
  norm: group                  # group | layer

loss:
  center_beta: 0.25
  axes_beta: 0.1
  w_center: 1.0
  w_axes: 1.0
  w_angle: 0.5
  w_safety: 1.0
  w_lambda_sdf: 0.2            # centre-free term inside safety
  w_lambda_border: 1.0         # border term inside safety
  w_continuity: 0.1
  safety_warmup_frac: 0.08     # safety weight ramps up over the first 8% of steps
  use_angle_mask: true
  m_safe_m: 0.0                # extra obstacle inflation inside the safety loss
  m_center_m: 0.0

train:
  batch_size: 8
  epochs: 30
  lr: 1.0e-3
  weight_decay: 1.0e-2
  warmup_frac: 0.03
  grad_clip: 5.0
  gumbel_tau_start: 1.0
  gumbel_tau_end: 0.3
  amp: true
  seeds: [0]
  eval_every: 1
  log_every: 50
  out_dir: ./runs_v3
  device: auto
