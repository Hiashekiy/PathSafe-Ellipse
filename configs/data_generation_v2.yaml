# ---------------------------------------------------------------------------
# PathSafe-Ellipse V2 config (global-scene sampling, distance-field centreline,
# fast fixed-centre 2x2 max-det ellipse labels).
# Units: metres unless a name says cells/px. Data output goes to *_v2 dirs.
# ---------------------------------------------------------------------------
project:
  name: PathSafe-Ellipse-V2
  random_seed: 42

paths:
  map_dir: ./data/street-map
  v2_root: ./data/processed_v2      # V2 only, never mixes with V1 caches
  scene_dir: ./data/processed_v2/scenes
  label_dir: ./data/processed_v2/labels
  report_dir: ./reports_v2
  viz_dir: ./outputs_v2

scene:
  size: 256                 # network input is the whole scene (no per-point patch)
  physical_fields_m: [48.0, 64.0, 80.0]   # -> crop 192 / 256 / 320 at 0.25 m/cell
  source_resolution: auto   # read from the .map header, fall back to 0.25
  max_scenes: null
  # conservative resampling: a target cell is occupied if ANY covered source cell
  # is occupied; up-sampling uses nearest neighbour.  No interpolation blending.
  keep_valid_mask: true

robot:
  radius_m: 0.25            # equivalent robot radius (fixed)
  safety_margin_m: 0.04     # separate numerical margin, configurable
  # inflation is a conservative Minkowski sum of the occupied square and the
  # robot disk, re-derived at the scene resolution r_scene (never a fixed 3x3)
  edt_upsample: 4           # sub-cell factor used to measure distance to square area

path:
  paths_per_scene: 5        # pilot value
  max_attempts: 60
  min_start_goal_ratio: 0.20    # 0.2 L <= |s-g| <= 0.75 L
  max_start_goal_ratio: 0.75
  min_path_length_m: 8.0
  start_goal_overlap_m: 1.5     # reject near-duplicate pairs

resample:
  spacing_normal_m: 1.25
  spacing_narrow_m: 0.75
  spacing_open_m: 2.0
  narrow_clearance_m: 1.0       # clearance below this -> narrow spacing
  open_clearance_m: 2.5         # clearance above this and low curvature -> open spacing
  curvature_open_deg: 10.0

centerline:
  w_pull: 1.0               # keep close to the A* point p_i
  w_clear: 1.2              # push towards larger distance-field value
  w_smooth: 0.8             # second-difference smoothness
  r_max_m: 3.0              # |q_i - p_i| <= R_max (configurable up to 4.0)
  end_ramp_m: 1.0           # gradual bias near the endpoints
  max_iter: 200
  clearance_penalty: 50.0
  radius_penalty: 200.0
  clear_min_m: 0.30         # must hold: D(q) >= robot radius + margin

anchor:
  spacing_normal_m: 1.5     # sparse adaptive anchors along the centreline
  spacing_narrow_m: 0.9
  spacing_open_m: 2.0
  narrow_clearance_m: 1.0
  open_clearance_m: 2.5

ellipse:
  r_init_max_m: 0.5         # initial safe circle radius cap (NOT a semi-axis floor)
  r_axis_max_m: 6.0         # R_E: ellipse semi-axis cap
  min_eig_m2: 1.0e-6        # numerical positive-definiteness floor on S
  epsilon_m: 0.01           # numerical margin subtracted from each half-space bound
  sectors: 32               # angular sectors for the active obstacle set
  active_target: 32         # target number of active half-spaces
  active_hard_limit: 48     # hard cap
  direction_candidates: 12  # candidate separation angles per obstacle cell
  max_outer_rounds: 3       # bounded rounds of added constraints
  area_change_tol: 0.01     # stop when relative area change < 1%
  solver: barrier           # barrier (production) | cvxpy (reference)
  verify_samples_cvxpy: 32  # cross-check count against the CLARABEL reference

continuity:
  rho_max: 0.85             # requirement on the midpoint coverage of both ellipses
  max_insert_per_interval: 2

lidar:
  ray_count: 16
  max_range_m: 9.0          # rays are cast from the ORIGINAL A* point p_i

runtime:
  log_level: INFO
