# ---------------------------------------------------------------------------
# PathSafe-Ellipse V2.1 config.
# Identical to V2 except the `centerline` module (route-constrained clearance
# optimisation with topology preservation) and the isolated output directories.
# Do not mix V2 and V2.1 labels in one dataset.
# ---------------------------------------------------------------------------
project:
  name: PathSafe-Ellipse-V2.1
  random_seed: 42
  label_version: v2.1

paths:
  map_dir: ./data/street-map
  v2_root: ./data/processed_v2_1
  scene_dir: ./data/processed_v2_1/scenes
  label_dir: ./data/processed_v2_1/labels
  report_dir: ./reports_v2_1
  viz_dir: ./outputs_v2_1

scene:
  size: 256
  physical_fields_m: [48.0, 64.0, 80.0]
  source_resolution: auto
  max_scenes: null
  keep_valid_mask: true

robot:
  radius_m: 0.25
  safety_margin_m: 0.04
  edt_upsample: 4

path:
  paths_per_scene: 5
  max_attempts: 60
  min_start_goal_ratio: 0.20
  max_start_goal_ratio: 0.75
  min_path_length_m: 8.0
  start_goal_overlap_m: 1.5

resample:
  spacing_normal_m: 1.25
  spacing_narrow_m: 0.75
  spacing_open_m: 2.0
  narrow_clearance_m: 1.0
  open_clearance_m: 2.5
  curvature_open_deg: 10.0

# ---------------------------------------------------------------- V2.1 ----
centerline:
  method: route_constrained_clearance
  r_max_m: 3.0                      # 五场景实验显示 3 m 已饱和（4 m 无额外收益）
  nonlocal_min_index_gap: 4         # only sections >=4 stations away count as a different route part                      # 首轮建议值（敏感性实验比较 2/3/4）
  station_tangent_limit_ratio: 0.25 # |t_i^T (q_i - p_i)| <= eta * L_i
  numeric_margin_m: 0.01
  station_projection_window: 3      # 站点顺序检查的局部投影窗口
  station_order_eps_m: 1.0e-6
  min_blend_alpha: 0.05            # d_safe = 0.25 + 0.04 + 0.01 = 0.30 m

  w_clear: 1.0                      # 净空收益（主目标）
  w_smooth: 0.15                    # 非均匀弧长曲率
  w_pull: 0.02                      # 弱路径偏移正则
  clearance_cap_m: 6.0              # = R_E，净空超过它不再激励移动

  max_iter: 200                     # 质量对迭代数不敏感（见 reports_v2_1/effort_sweep.json）
  ftol: 1.0e-9
  constraint_tol: 1.0e-5

  multi_start: true
  multi_start_count: 1              # 3 个初值收敛到同一目标，仅耗时 x3
  init_offsets_m: [0.5, 1.0]

  max_optimised_stations: 32        # 多分辨率：粗结点求解 + 偏移插值
  segment_collocation_points: 2     # 每段 1/3、2/3 处净空配点
  legacy_segment_check_step_cells: 0.25   # V2 对照基线保持原采样密度
  legacy_homotopy_check_step_cells: 0.25
  segment_check_step_cells: 0.05     # 正式生成的高密度验证（0.0125 m）
  homotopy_check_step_cells: 0.05    # 同伦 λ 步长同密度
  homotopy_max_disp_cells: 0.05     # lambda 采样使相邻变形位移 <= 0.05*r_scene

  # legacy V2 keys (only used when method: legacy_weighted, kept for reference)
  end_ramp_m: 1.0
  clear_min_m: 0.30
  clearance_penalty: 50.0
  radius_penalty: 200.0

anchor:
  spacing_normal_m: 1.5
  spacing_narrow_m: 0.9
  spacing_open_m: 2.0
  narrow_clearance_m: 1.0
  open_clearance_m: 2.5

ellipse:
  r_init_max_m: 0.5
  r_axis_max_m: 6.0
  min_eig_m2: 1.0e-6
  epsilon_m: 0.01
  sectors: 32
  active_target: 32
  active_hard_limit: 48
  direction_candidates: 12
  max_outer_rounds: 3
  area_change_tol: 0.01
  solver: barrier
  verify_samples_cvxpy: 32

continuity:
  rho_max: 0.85
  max_insert_per_interval: 2

lidar:
  ray_count: 16
  max_range_m: 9.0

runtime:
  log_level: INFO
